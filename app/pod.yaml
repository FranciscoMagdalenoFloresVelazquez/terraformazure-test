# Pod con dos contenedores que comparten red (localhost).
# Solo Nginx publica puertos hacia la VM (80 y 443).
apiVersion: v1
kind: Pod
metadata:
  name: web
spec:
  containers:
    - name: flask
      image: localhost/flask-app:latest
      imagePullPolicy: IfNotPresent
      env:
        - name: APP_ENV
          value: azure
    - name: nginx
      image: localhost/web-nginx:latest
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 80
          hostPort: 80
        - containerPort: 443
          hostPort: 443
      volumeMounts:
        - name: certs
          mountPath: /etc/nginx/certs
          readOnly: true
  volumes:
    - name: certs
      hostPath:
        path: /home/azureuser/certs
        type: Directory
