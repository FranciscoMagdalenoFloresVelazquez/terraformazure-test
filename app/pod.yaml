# Pod con dos contenedores que comparten red (localhost).
# Solo Nginx publica un puerto hacia la VM (80).
apiVersion: v1
kind: Pod
metadata:
  name: web
spec:
  containers:
    - name: flask
      image: localhost/flask-app:latest
      imagePullPolicy: IfNotPresent
      env:
        - name: APP_ENV
          value: azure
    - name: nginx
      image: localhost/web-nginx:latest
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 80
          hostPort: 80
